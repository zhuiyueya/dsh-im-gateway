<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="990" viewBox="0 0 1080 990">
  <defs>
    <marker id="arrAmber" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/>
    </marker>
    <marker id="arrGreen" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#10b981"/>
    </marker>
    <marker id="arrIndigo" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6366f1"/>
    </marker>
    <marker id="arrGray" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#94a3b8"/>
    </marker>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1080" height="990" fill="#f8fafc"/>

  <!-- ═══════════ ① 交互层 ═══════════ -->
  <rect x="60" y="50" width="920" height="135" rx="14" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.5"/>
  <text x="76" y="72" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#3730a3">① 交互层 — 人与 agent 对话的入口</text>
  <rect x="80" y="88" width="330" height="80" rx="10" fill="#ffffff" stroke="#a5b4fc" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="245" y="112" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#1e293b" text-anchor="middle">dsh Web GUI 设置面板</text>
  <text x="245" y="134" font-family="system-ui, sans-serif" font-size="12.5" fill="#64748b" text-anchor="middle">IM 网关插件 · 扫码 / 填凭据</text>
  <text x="245" y="154" font-family="system-ui, sans-serif" font-size="12.5" fill="#64748b" text-anchor="middle">一键批准待授权用户</text>
  <rect x="450" y="88" width="510" height="80" rx="10" fill="#ffffff" stroke="#a5b4fc" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="705" y="112" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#1e293b" text-anchor="middle">20+ IM 聊天软件</text>
  <text x="705" y="135" font-family="system-ui, sans-serif" font-size="12.5" fill="#64748b" text-anchor="middle">微信 · 飞书 · QQ · Telegram · Discord · Slack · WhatsApp · Signal · Teams · LINE · Matrix …</text>
  <text x="705" y="156" font-family="system-ui, sans-serif" font-size="12.5" fill="#64748b" text-anchor="middle">手机长按输入（分段消息）· 群聊 / 私聊 · 图片 / 语音 / 文件 / 视频</text>

  <!-- ═══════════ ② 控制面 ═══════════ -->
  <rect x="60" y="205" width="920" height="115" rx="14" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.5"/>
  <text x="76" y="227" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#3730a3">② 控制面 — ChannelManager（UI 驱动的渠道生命周期）</text>
  <rect x="80" y="240" width="280" height="62" rx="10" fill="#ffffff" stroke="#a5b4fc" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="220" y="264" font-family="system-ui, sans-serif" font-size="14.5" font-weight="600" fill="#1e293b" text-anchor="middle">HTTP API /dsh-im-gateway/api</text>
  <text x="220" y="287" font-family="system-ui, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">connect · disconnect · refresh · approve · deny</text>
  <rect x="390" y="240" width="290" height="62" rx="10" fill="#ffffff" stroke="#a5b4fc" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="535" y="264" font-family="system-ui, sans-serif" font-size="14.5" font-weight="600" fill="#1e293b" text-anchor="middle">渠道启停 / 刷新二维码</text>
  <text x="535" y="287" font-family="system-ui, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">无需重启 dsh，配置自动持久化</text>
  <rect x="710" y="240" width="250" height="62" rx="10" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="835" y="264" font-family="system-ui, sans-serif" font-size="14.5" font-weight="600" fill="#78350f" text-anchor="middle">channels.json 落盘</text>
  <text x="835" y="287" font-family="system-ui, sans-serif" font-size="12" fill="#92400e" text-anchor="middle">UI 配置 ＞ cordis 配置兜底</text>

  <!-- ═══════════ ③ 渠道适配层 ═══════════ -->
  <rect x="60" y="340" width="920" height="135" rx="14" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.5"/>
  <text x="76" y="362" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#065f46">③ 渠道适配层 — 每个渠道一个 ChannelAdapter（协议归一化）</text>
  <rect x="80" y="376" width="880" height="84" rx="10" fill="#ffffff" stroke="#6ee7b7" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="100" y="398" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#047857">统一契约：ChannelAdapter（start / stop / send / setMessageHandler / loginUrl / authorizes）· ImMessage · ImMedia</text>
  <text x="100" y="422" font-family="system-ui, sans-serif" font-size="12.5" fill="#334155">wechat · feishu · qqbot · telegram · discord · slack · whatsapp · signal · msteams · line · matrix · mattermost · irc · twitch · nostr · nextcloud · synology · zalo · imessage · …</text>
  <text x="100" y="444" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">代表实现：微信 = iLink 扫码登录 + 长轮询 + CDN AES-128-ECB 加密媒体 | QQ = 官方 WebSocket 网关 + 指数退避重连 | Telegram = HTML 模式富文本</text>

  <!-- ═══════════ ④ 网关核心 ═══════════ -->
  <rect x="60" y="495" width="920" height="210" rx="14" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
  <text x="76" y="517" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#991b1b">④ 网关核心 — ImGateway（协议无关的大脑，只认 ImMessage）</text>
  <rect x="80" y="530" width="440" height="158" rx="10" fill="#ffffff" stroke="#fca5a5" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="100" y="553" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#b91c1c">入站流水线 handleInbound</text>
  <text x="100" y="578" font-family="system-ui, sans-serif" font-size="12.5" fill="#334155">1️⃣ 恢复该聊天上次绑定的会话（重启续聊）</text>
  <text x="100" y="600" font-family="system-ui, sans-serif" font-size="12.5" fill="#334155">2️⃣ 命令路由（/status /new /sessions …）→ 审批应答（批准/拒绝）</text>
  <text x="100" y="622" font-family="system-ui, sans-serif" font-size="12.5" fill="#334155">3️⃣ 白名单校验（未授权 → 登记待授权并拦截）</text>
  <text x="100" y="644" font-family="system-ui, sans-serif" font-size="12.5" fill="#334155">4️⃣ 提问回答消费 → 媒体消息（图片 → image block）</text>
  <text x="100" y="666" font-family="system-ui, sans-serif" font-size="12.5" fill="#334155">5️⃣ 合并窗口 → agent.followup 注入（source=user）</text>
  <rect x="550" y="530" width="410" height="72" rx="10" fill="#ffffff" stroke="#fca5a5" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="570" y="553" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#b91c1c">出站：全局监听 session/event</text>
  <text x="570" y="576" font-family="system-ui, sans-serif" font-size="12.5" fill="#334155">assistant/message → 按 sessionId 反查聊天 → splitText 分片</text>
  <text x="570" y="594" font-family="system-ui, sans-serif" font-size="12.5" fill="#334155">→ channel.send（turn/start 打字指示 · turn/end 轮末摘要）</text>
  <rect x="550" y="612" width="410" height="76" rx="10" fill="#ffffff" stroke="#fca5a5" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="570" y="634" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#b91c1c">核心组件（协议无关）</text>
  <text x="570" y="656" font-family="system-ui, sans-serif" font-size="12.5" fill="#334155">SessionRouter（per-chat / bound）· ApprovalBroker（审批桥）</text>
  <text x="570" y="676" font-family="system-ui, sans-serif" font-size="12.5" fill="#334155">QuestionBroker（提问桥）· SessionMerger（分段合并）· splitText · format</text>

  <!-- ═══════════ ⑤ DSH 平台 ═══════════ -->
  <rect x="60" y="725" width="920" height="125" rx="14" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
  <text x="76" y="747" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#14532d">⑤ DSH 平台 — Cordis 服务注入（dsh 原生能力）</text>
  <rect x="80" y="760" width="880" height="62" rx="10" fill="#ffffff" stroke="#86efac" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="100" y="784" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#166534">agents（创建/复用/续会话）· session/event（全局事件总线）· agentPresets（挂 preset 才有核心工具）· sessionQuery · userQuestions · userApproval</text>
  <text x="100" y="806" font-family="system-ui, sans-serif" font-size="13" fill="#334155">attachments（图片 → image block）· tools（im_send_file 发文件）· webServer（HTTP API）· jobs（后台任务对 UI 可见）</text>
  <text x="520" y="838" font-family="system-ui, sans-serif" font-size="12.5" fill="#475569" text-anchor="middle">dsh agent 会话 —— 会话 id 形如 im:&lt;渠道&gt;:&lt;聊天&gt;:&lt;时间戳&gt;</text>

  <!-- ═══════════ ⑥ 持久化与锁 ═══════════ -->
  <rect x="60" y="870" width="920" height="95" rx="14" fill="#fffbeb" stroke="#fde68a" stroke-width="1.5"/>
  <text x="76" y="892" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#78350f">⑥ 状态持久化与实例锁（$DSH_HOME/dsh-im-gateway/）</text>
  <text x="100" y="918" font-family="system-ui, sans-serif" font-size="13" fill="#92400e">channels.json（渠道配置/白名单/待授权）· chat-sessions.json（重启恢复会话）· wechat-state.json（免扫码恢复）· workspaces.json（每聊天工作区）· instance.lock（防多实例写坏会话日志）</text>
  <text x="100" y="942" font-family="system-ui, sans-serif" font-size="12" fill="#a16207">gateway.log（环形日志 · Web UI 可读）· media/（微信媒体缓存）</text>

  <!-- ═══════════ 流程箭头 ═══════════ -->
  <!-- ① 入站消息流（左缘，琥珀色）：IM → 适配层 → 网关核心 → DSH 平台 -->
  <line x1="25" y1="185" x2="25" y2="790" stroke="#f59e0b" stroke-width="3" marker-end="url(#arrAmber)"/>
  <text x="18" y="500" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#b45309" transform="rotate(-90 18 500)" text-anchor="middle">① 入站消息流：IM → 适配层归一化 → 网关核心（路由/审批/提问/合并）→ agent.followup</text>

  <!-- ② 出站回复流（右缘，绿色）：DSH 平台 → 网关核心 → 适配层 → IM -->
  <line x1="1055" y1="790" x2="1055" y2="165" stroke="#10b981" stroke-width="3" marker-end="url(#arrGreen)"/>
  <text x="1048" y="500" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#047857" transform="rotate(-90 1048 500)" text-anchor="middle">② 出站回复流：session/event → 网关核心分片 → 适配层 send → IM 聊天</text>

  <!-- ③ 控制流（左缘内侧，靛蓝虚线）：ChannelManager ↔ 网关注册/白名单 -->
  <line x1="48" y1="330" x2="48" y2="485" stroke="#6366f1" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#arrIndigo)"/>
  <text x="41" y="410" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#4338ca" transform="rotate(-90 41 410)" text-anchor="middle">③ 控制流：ChannelManager → 网关注册 / 白名单同步</text>

  <!-- 层间小箭头 -->
  <line x1="245" y1="168" x2="245" y2="205" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrGray)"/>
  <text x="258" y="192" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">设置 / 批准</text>

  <line x1="535" y1="320" x2="535" y2="340" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrGray)"/>
  <text x="548" y="334" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">start / stop</text>

  <line x1="700" y1="475" x2="700" y2="495" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrGray)"/>
  <text x="712" y="490" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">ImMessage</text>

  <line x1="800" y1="495" x2="800" y2="475" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrGray)"/>
  <text x="812" y="474" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">分片回复</text>

  <line x1="285" y1="705" x2="285" y2="725" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrGray)"/>
  <text x="298" y="719" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">followup 注入</text>

  <line x1="640" y1="725" x2="640" y2="705" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrGray)"/>
  <text x="653" y="702" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">session/event</text>
</svg>
